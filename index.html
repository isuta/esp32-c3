<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZAKU COCKPIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .monoeye-btn {
            background: linear-gradient(135deg, #ff006e 0%, #8338ec 100%);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
            transition: all 0.3s ease;
        }
        
        .monoeye-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.8);
        }
        
        .monoeye-btn.active {
            background: linear-gradient(135deg, #ff006e 0%, #ff0080 100%);
            box-shadow: 0 0 40px rgba(255, 0, 110, 1);
            animation: pulse 1.5s infinite;
        }
        
        .gun-btn {
            background: linear-gradient(135deg, #ffd60a 0%, #ff9500 100%);
            box-shadow: 0 0 20px rgba(255, 214, 10, 0.5);
            transition: all 0.3s ease;
        }
        
        .gun-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 214, 10, 0.8);
        }
        
        .gun-btn.firing {
            background: linear-gradient(135deg, #ff9500 0%, #ff6b00 100%);
            box-shadow: 0 0 40px rgba(255, 149, 0, 1);
            animation: blink 0.1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.7; }
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .status-connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        
        .status-disconnected {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        
        .cockpit-panel {
            background: rgba(22, 33, 62, 0.8);
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .system-font {
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- ヘッダー -->
        <div class="cockpit-panel rounded-t-lg p-4 mb-4">
            <h1 class="text-2xl font-bold text-center text-green-400 system-font">
                ZAKU COCKPIT
            </h1>
            <div class="text-center text-sm text-green-300 mt-2 system-font">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">接続中...</span>
            </div>
        </div>

        <!-- コントロールパネル -->
        <div class="cockpit-panel rounded-lg p-6 space-y-6">
            <!-- モノアイ制御 -->
            <div>
                <label class="block text-green-400 text-sm font-bold mb-3 system-font">
                    MONO-EYE SYSTEM
                </label>
                <div class="grid grid-cols-2 gap-4">
                    <button 
                        id="monoeye-on-btn"
                        class="monoeye-btn text-white font-bold py-4 px-6 rounded-lg text-lg system-font"
                        onclick="sendCommand('monoeye_on')">
                        POWER ON
                    </button>
                    <button 
                        id="monoeye-off-btn"
                        class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 px-6 rounded-lg text-lg system-font"
                        onclick="sendCommand('monoeye_off')">
                        POWER OFF
                    </button>
                </div>
            </div>

            <!-- マシンガン制御 -->
            <div>
                <label class="block text-yellow-400 text-sm font-bold mb-3 system-font">
                    WEAPON SYSTEM
                </label>
                <button 
                    id="gun-btn"
                    class="gun-btn w-full text-white font-bold py-8 px-6 rounded-lg text-xl system-font"
                    onpointerdown="fireStart()"
                    onpointerup="fireEnd()"
                    onpointerleave="fireEnd()">
                    MACHINE GUN<br>
                    <span class="text-sm">長押しで連射</span>
                </button>
            </div>

            <!-- ステータス表示 -->
            <div class="border-t border-green-800 pt-4">
                <div class="text-green-400 text-xs system-font space-y-1">
                    <div>SYSTEM: <span id="systemStatus">STANDBY</span></div>
                    <div>MONOEYE: <span id="monoeye-status">OFF</span></div>
                    <div>WEAPON: <span id="weapon-status">READY</span></div>
                </div>
            </div>
        </div>

        <!-- フッター -->
        <div class="text-center mt-4 text-green-600 text-xs system-font">
            ZAKU Motion Control System v1.0
        </div>
    </div>

    <script>
        let ws = null;
        let isMonoeyeOn = false;
        let isFiring = false;
        let reconnectTimer = null;

        // WebSocket接続
        function connect() {
            try {
                // ホスト取得（プレビュー環境対策）
                const host = window.location.host || '192.168.4.1';
                const wsUrl = `ws://${host}/`;
                
                console.log('Connecting to:', wsUrl);
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    updateStatus(true);
                    updateSystemStatus('ONLINE');
                    
                    // 再接続タイマークリア
                    if (reconnectTimer) {
                        clearTimeout(reconnectTimer);
                        reconnectTimer = null;
                    }
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected');
                    updateStatus(false);
                    updateSystemStatus('OFFLINE');
                    
                    // 3秒後に再接続
                    reconnectTimer = setTimeout(() => {
                        console.log('Reconnecting...');
                        connect();
                    }, 3000);
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };

                ws.onmessage = (event) => {
                    console.log('Received:', event.data);
                };

            } catch (error) {
                console.error('Connection error:', error);
                updateStatus(false);
            }
        }

        // ステータス表示更新
        function updateStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                indicator.className = 'status-indicator status-connected';
                statusText.textContent = '接続中';
            } else {
                indicator.className = 'status-indicator status-disconnected';
                statusText.textContent = '切断';
            }
        }

        function updateSystemStatus(status) {
            document.getElementById('systemStatus').textContent = status;
        }

        // コマンド送信
        function sendCommand(command) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(command);
                console.log('Sent:', command);
                
                // UI更新
                if (command === 'monoeye_on') {
                    isMonoeyeOn = true;
                    document.getElementById('monoeye-on-btn').classList.add('active');
                    document.getElementById('monoeye-status').textContent = 'ACTIVE';
                    updateSystemStatus('OPERATIONAL');
                } else if (command === 'monoeye_off') {
                    isMonoeyeOn = false;
                    document.getElementById('monoeye-on-btn').classList.remove('active');
                    document.getElementById('monoeye-status').textContent = 'OFF';
                    updateSystemStatus('STANDBY');
                }
            } else {
                console.error('WebSocket not connected');
                alert('サーバーに接続されていません');
            }
        }

        // マシンガン発射開始
        function fireStart() {
            if (!isFiring) {
                isFiring = true;
                sendCommand('gun_press');
                document.getElementById('gun-btn').classList.add('firing');
                document.getElementById('weapon-status').textContent = 'FIRING';
            }
        }

        // マシンガン発射終了
        function fireEnd() {
            if (isFiring) {
                isFiring = false;
                sendCommand('gun_release');
                document.getElementById('gun-btn').classList.remove('firing');
                document.getElementById('weapon-status').textContent = 'READY';
            }
        }

        // ページ読み込み時に接続
        window.addEventListener('load', () => {
            connect();
        });

        // ページ離脱時にWebSocketクローズ
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
